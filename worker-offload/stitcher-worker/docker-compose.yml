services:
  stitcher-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stitcher-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./server.py:/app/server.py
      - ./src:/app/src
    environment:
      - WORKER_CONCURRENCY=16
      - PORT=8000
